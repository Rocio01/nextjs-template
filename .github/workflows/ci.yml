name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder so env validation passes; real value is set on the host.
      NEXT_PUBLIC_SITE_URL: https://example.com
      # Cypress is not run in CI, so skip its binary download.
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
